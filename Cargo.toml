[package]
name = "wattson"
version = "0.1.0"
edition = "2021"
description = "Per-request GPU energy and cost accounting for LLM inference"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }

# NVIDIA's NVML library only exists on Linux (and Windows) machines with a GPU.
# On other systems (e.g. a Mac) Wattson builds without it and uses the simulator.
[target.'cfg(target_os = "linux")'.dependencies]
nvml-wrapper = "0.13"

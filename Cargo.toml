[package]
name = "wattson"
version = "0.1.0"
edition = "2021"
description = "Per-request GPU energy and cost accounting for LLM inference"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
